name: Build Debug APK

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleFlavorDefaultDebug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: markor-debug-apk
          path: app/build/outputs/apk/flavorDefault/debug/*.apk
          if-no-files-found: error
          retention-days: 7
